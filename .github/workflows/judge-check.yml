# The judge's side of every unit, on each pull request: the question the hive's judge asks of the project's tip
# itself (« does the machine work? », docs/reference-judge.md of Bee-ruche/hive): the manifest and its bounds, the
# reference and the generator built in their container (the generator with -Werror), the control (the blank leaf
# built twice with two nonces, two different binaries, nothing written on no case), cases drawn and their expected
# answers framed as the judge wants, for every unit of bee/reference/project.json. No leaf is judged here.
#
# The judge is Bee-ruche/hive's, at the commit .github/workflows/hive.yml runs: move both together (the check fails
# when they differ). The project's code runs only in the judge's containers, without network; this workflow holds no
# secret and reads only. It runs the pull request's own copy of itself: it tells mistakes, it does not guard against
# a pull request that changes it (who merges reads that).
name: Judge check
on:
  pull_request:
permissions:
  contents: read

jobs:
  tip-itself:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: project
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Bee-ruche/hive
          ref: d1e91fa8b88eb8bdcfa2b5a8327a96053bef1528
          path: protocol
          persist-credentials: false
      - name: The judge is the one the project's hourly run names
        run: |
          judged="$(git -C protocol rev-parse HEAD)"
          runs="$(sed -n 's|^ *uses: Bee-ruche/hive/\.github/workflows/run\.yml@\([0-9a-f]\{40\}\)$|\1|p' project/.github/workflows/hive.yml)"
          echo "this check judges with Bee-ruche/hive at $judged; hive.yml runs $runs"
          [ "$judged" = "$runs" ] || { echo "::error::move this workflow's judge and hive.yml's commit together"; exit 1; }
      - name: The tip, written out without its repository (the judge refuses a tree that is one)
        run: |
          mkdir tip
          git -C project archive HEAD | tar -x -C tip
      - name: The judge's image (with network; the hive's own Dockerfile, nothing of the project)
        run: python3 -B protocol/tools/judge/reference.py --tip "$GITHUB_WORKSPACE/tip" --image-only
      - name: The tip itself, unit by unit (the project's code runs only in the judge's containers, without network)
        run: |
          python3 -B - <<'EOF'
          import json, os, re, shutil, subprocess, sys, time
          here = os.environ["GITHUB_WORKSPACE"]
          tip, broken, work, reports = (os.path.join(here, name) for name in ("tip", "broken", "work", "reports"))
          units = json.load(open(os.path.join(tip, "bee/reference/project.json")))["units"]
          budget = int(json.load(open(os.path.join(tip, "hive/project.json")))["judge"]["timeout_seconds"])
          os.makedirs(reports)

          def judge(tree, name, files):
              """The judge's code, and its report: the step it reached, the seed it drew, the reason it stopped."""
              report = os.path.join(reports, f"{os.path.basename(tree)}-{name}.json")
              command = [sys.executable, "-B", os.path.join(here, "protocol/tools/judge/reference.py"), "--tip", tree,
                         "--unit", name, "--tip-itself", "--budget", str(budget), "--workdir", work, "--json", report]
              for path in files:
                  command += ["--task-file", path]
              start = time.monotonic()
              print(f"::group::{os.path.basename(tree)}: {name}", flush=True)
              code = subprocess.run(command).returncode
              print("::endgroup::", flush=True)
              said = json.load(open(report)) if os.path.exists(report) else {}
              print(f"{os.path.basename(tree)}: {name}: code {code}, step {said.get('step')}, seed {said.get('seed_origin')}, "
                    f"{time.monotonic() - start:.1f} s" + (f", {said['reason']}" if "reason" in said else ""), flush=True)
              return code, said

          failed = []
          for name, unit in units.items():
              if not re.fullmatch(r"[a-z0-9_]{1,32}", name):
                  sys.exit("the manifest names a unit the judge would not take")
              code, said = judge(tip, name, unit["files"])
              if code != 0 or said.get("step") != 6 or said.get("seed_origin") != "drawn":
                  failed.append(name)
          # A known failure, so that this check is seen to fail when it should: the same tip (its links kept as links)
          # with a generator that does not build must stop at the reference's build, for that reason and no other.
          shutil.copytree(tip, broken, symlinks=True)
          with open(os.path.join(broken, "harness/c/generate.c"), "a") as f:
              f.write("\n#error a known failure: the check must see it\n")
          first = next(iter(units))
          code, said = judge(broken, first, units[first]["files"])
          reason = said.get("reason", "")
          if code != 2 or said.get("step") != 2 or "the reference's build" not in reason or "a known failure" not in reason:
              failed.append("the known failure (a generator that does not build) was not told as it should be")
          sys.exit("the judge check failed: " + "; ".join(failed) if failed else 0)
          EOF
